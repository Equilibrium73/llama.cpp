name: k2h-win-cuda
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install CUDA 12.8 from NVIDIA redist (no installer)
        shell: pwsh
        run: |
          $base = 'https://developer.download.nvidia.com/compute/cuda/redist'
          $dst  = 'C:\cuda128'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          $pkgs = @(
            'cuda_nvcc/windows-x86_64/cuda_nvcc-windows-x86_64-12.8.61-archive.zip',
            'cuda_cudart/windows-x86_64/cuda_cudart-windows-x86_64-12.8.57-archive.zip',
            'cuda_nvrtc/windows-x86_64/cuda_nvrtc-windows-x86_64-12.8.61-archive.zip',
            'libcublas/windows-x86_64/libcublas-windows-x86_64-12.8.3.14-archive.zip',
            'cuda_cccl/windows-x86_64/cuda_cccl-windows-x86_64-12.8.55-archive.zip'
          )
          foreach ($p in $pkgs) {
            $zip = Join-Path $env:RUNNER_TEMP (Split-Path $p -Leaf)
            curl.exe -sSL "$base/$p" -o $zip
            $tmp = Join-Path $env:RUNNER_TEMP 'x'
            Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
            Expand-Archive -Path $zip -DestinationPath $tmp -Force
            $inner = Get-ChildItem $tmp -Directory | Select-Object -First 1
            if ($inner) { Copy-Item -Path "$($inner.FullName)\*" -Destination $dst -Recurse -Force }
            else { Copy-Item -Path "$tmp\*" -Destination $dst -Recurse -Force }
          }
          Get-ChildItem "$dst\bin\nvcc.exe" | Select-Object FullName
          "CUDA_PATH=$dst"        | Out-File -FilePath $env:GITHUB_ENV -Append
          "CUDAToolkit_ROOT=$dst" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$dst\bin"              | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install Ninja
        run: choco install ninja -y

      - name: Configure
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DBUILD_SHARED_LIBS=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CUDA=ON ^
            -DGGML_BACKEND_DL=ON ^
            -DLLAMA_BUILD_SERVER=ON ^
            -DLLAMA_BUILD_TESTS=OFF ^
            -DLLAMA_BUILD_EXAMPLES=OFF ^
            -DLLAMA_CURL=OFF ^
            -DCUDAToolkit_ROOT=C:/cuda128 ^
            -DCMAKE_CUDA_ARCHITECTURES=120

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake --build build --config Release -j %NUMBER_OF_PROCESSORS%

      - name: Collect and report
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $files = @('llama.dll','llama-common.dll','ggml.dll','ggml-base.dll','ggml-cpu.dll','ggml-cuda.dll','mtmd.dll','llama-server.exe','llama-cli.exe')
          foreach ($f in $files) { if (Test-Path "build/bin/Release/$f") { Copy-Item "build/bin/Release/$f" out } }
          Get-ChildItem out | Select-Object Name, Length | Format-Table
          try { & build/bin/Release/llama-cli.exe --version } catch { Write-Host "version print failed" }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: k2h-win-cuda128-x64
          path: out/*
          retention-days: 7